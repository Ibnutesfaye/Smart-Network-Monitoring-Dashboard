services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      WEBSOCKET_ALLOW_QUERY_AUTH: "False"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [internal]

  celery_worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  celery_beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info --schedule=/var/run/celery/celerybeat-schedule
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - celery_schedule:/var/run/celery
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - media_data:/usr/share/nginx/media:ro
      - static_data:/usr/share/nginx/static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - internal

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  celery_schedule:
